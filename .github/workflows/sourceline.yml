name: SourceLine CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/sourceline.yml"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.html"
      - "**/*.htm"
      - "examples/sourceline.config.json"
      - "examples/sources/**"
      - "packages/**"
      - "action.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "tsconfig.base.json"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify workspace manifests
        run: corepack pnpm run release:verify-manifests

      - name: Build and typecheck
        run: corepack pnpm run check

      - name: Test
        run: corepack pnpm test

      - name: Package smoke
        run: |
          mkdir -p .tmp-pack
          corepack pnpm --filter sourceline pack --pack-destination .tmp-pack
          corepack pnpm run release:verify-tarball

      - name: CLI smoke
        run: |
          node packages/cli/dist/index.js check examples/answer.md --report terminal
          node packages/cli/dist/index.js check examples/answer.md --json > sourceline-report.json
          node packages/cli/dist/index.js check examples/sources/web-evidence.html --report markdown --out sourceline-html-input-report.md
          node packages/cli/dist/index.js check examples/answer.md --search local --sources examples/sources --report markdown --out sourceline-local-report.md
          grep -q "SourceLine Notes" sourceline-local-report.md
          grep -q "AI Answer Review Notes" sourceline-local-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: sourceline-cli-smoke-reports
          path: |
            sourceline-report.json
            sourceline-html-input-report.md
            sourceline-local-report.md

  action-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Generate SourceLine report
        uses: ./
        with:
          input: examples/answer.md
          config: examples/sourceline.config.json
          output: sourceline-report.md
          fail-on: unsupported

      - name: Verify action report uses local sources
        run: |
          grep -q "SourceLine Notes" sourceline-report.md
          grep -q "AI Answer Review Notes" sourceline-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: sourceline-markdown-report
          path: sourceline-report.md